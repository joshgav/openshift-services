apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: community-policies
  namespace: openshift-gitops
spec:
  destination:
    namespace: open-cluster-management-policies
    server: https://kubernetes.default.svc
  project: default
  source:
    path: community
    repoURL: https://github.com/open-cluster-management-io/policy-collection.git
    targetRevision: main
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true